apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra-api
  labels:
    app: hydra
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hydra
      component: api
  template:
    metadata:
      labels:
        app: hydra
        component: api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hydra
              topologyKey: kubernetes.io/hostname
      containers:
      - name: hydra-api
        image: hydra/api:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hydra-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: hydra-secrets
              key: redis-url
        - name: VENICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: hydra-secrets
              key: venice-api-key
        - name: RATE_LIMIT_REQUESTS
          valueFrom:
            configMapKeyRef:
              name: hydra-config
              key: rate-limit-requests
        - name: RATE_LIMIT_WINDOW
          valueFrom:
            configMapKeyRef:
              name: hydra-config
              key: rate-limit-window
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hydra-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hydra-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80