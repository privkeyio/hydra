apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hydra.fullname" . }}-secrets
  labels:
    {{- include "hydra.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default "postgresql://user:pass@postgres:5432/hydra" | quote }}
  redis-url: {{ .Values.secrets.redisUrl | default "redis://redis:6379/0" | quote }}
  venice-api-key: {{ .Values.secrets.veniceApiKey | default "REPLACE_ME" | quote }}