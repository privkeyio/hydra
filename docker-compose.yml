version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hydra}
      POSTGRES_USER: ${POSTGRES_USER:-hydra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hydra_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hydra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hydra

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - hydra

  hydra-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hydra}:${POSTGRES_PASSWORD:-hydra_secret}@postgres:5432/${POSTGRES_DB:-hydra}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VENICE_API_KEY: ${VENICE_API_KEY}
      API_KEYS: ${API_KEYS:-hydra_test_key}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - hydra

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A hydra.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hydra}:${POSTGRES_PASSWORD:-hydra_secret}@postgres:5432/${POSTGRES_DB:-hydra}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VENICE_API_KEY: ${VENICE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hydra

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A hydra.workers.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hydra}:${POSTGRES_PASSWORD:-hydra_secret}@postgres:5432/${POSTGRES_DB:-hydra}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hydra

  websocket-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m hydra.workers.websocket
    ports:
      - "${WS_PORT:-8765}:8765"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hydra

volumes:
  postgres_data:
  redis_data:

networks:
  hydra:
    driver: bridge