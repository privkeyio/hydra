name: "Claude Code"
version: "1.0.0"
description: "Claude Code plugin for AI-powered development"
author: "Hydra Development Team"

capabilities:
  - "interactive_ai"
  - "file_operations" 
  - "code_generation"
  - "session_management"

requirements:
  executables:
    - name: "claude"
      description: "Claude CLI binary"
      paths:
        - "claude"
        - "/usr/local/bin/claude"
        - "$HOME/.claude/local/claude"
  optional_executables:
    - name: "tmux"
      description: "Terminal multiplexer for session management"
      paths:
        - "tmux"
        - "/usr/bin/tmux"

providers:
  - name: "claude_cli"
    class: "ClaudeCLIProvider"
    module: "claude_cli"
    config_schema:
      claude_path: 
        type: "string"
        description: "Path to Claude CLI binary"
        default: "claude"
      cli_flags:
        type: "string"
        description: "Additional CLI flags"
        default: ""
      timeout:
        type: "integer"
        description: "Timeout in seconds"
        default: 120

  - name: "claude_tmux" 
    class: "ClaudeTmuxProvider"
    module: "claude_tmux"
    config_schema:
      claude_path:
        type: "string"
        description: "Path to Claude CLI binary"
        default: "claude"
      timeout:
        type: "integer"
        description: "Session timeout in seconds"  
        default: 300

  - name: "claude_interactive"
    class: "ClaudeInteractiveProvider"
    module: "claude_interactive"
    config_schema:
      claude_path:
        type: "string"
        description: "Path to Claude CLI binary"
        default: "claude"

entry_points:
  main_provider: "claude_cli"
  interactive_provider: "claude_interactive"
  session_provider: "claude_tmux"