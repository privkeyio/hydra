name: Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Deploy to staging
      run: |
        helm upgrade --install hydra-staging ./k8s/helm/hydra \
          --namespace hydra-staging \
          --create-namespace \
          --values ./k8s/helm/hydra/values-staging.yaml \
          --set image.tag=${{ github.sha }} \
          --wait --timeout=10m

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/hydra-staging -n hydra-staging --timeout=300s
        kubectl get pods -n hydra-staging

    - name: Run smoke tests
      run: |
        STAGING_URL=$(kubectl get ingress hydra-staging -n hydra-staging -o jsonpath='{.spec.rules[0].host}')
        curl -f "https://${STAGING_URL}/health" || exit 1

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy-staging]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Backup current deployment
      run: |
        kubectl create backup hydra-backup-$(date +%Y%m%d-%H%M%S) \
          --from-deployment hydra-production \
          -n hydra-production || true

    - name: Deploy to production
      id: deploy
      run: |
        helm upgrade --install hydra-production ./k8s/helm/hydra \
          --namespace hydra-production \
          --create-namespace \
          --values ./k8s/helm/hydra/values-prod.yaml \
          --set image.tag=${{ github.sha }} \
          --wait --timeout=15m

    - name: Verify production deployment
      run: |
        kubectl rollout status deployment/hydra-production -n hydra-production --timeout=600s
        kubectl get pods -n hydra-production

    - name: Run production health checks
      id: health_check
      run: |
        PROD_URL=$(kubectl get ingress hydra-production -n hydra-production -o jsonpath='{.spec.rules[0].host}')
        for i in {1..5}; do
          if curl -f "https://${PROD_URL}/health"; then
            echo "Health check passed"
            exit 0
          fi
          echo "Health check failed, attempt $i/5"
          sleep 30
        done
        exit 1

    - name: Rollback on failure
      if: failure() && steps.deploy.conclusion == 'success'
      run: |
        echo "Rolling back deployment due to health check failure"
        helm rollback hydra-production -n hydra-production
        kubectl rollout status deployment/hydra-production -n hydra-production --timeout=300s
        exit 1