name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install psutil
    
    - name: Set test environment
      run: |
        export LLM_PROVIDER=mock
        export REDIS_URL=redis://localhost:6379/0
        export DATABASE_URL=sqlite:///test.db
    
    - name: Run linting
      run: |
        ruff check src/ --exclude="src/hydra/templates/templates" --select=E9,F63,F7,F82 || true
        echo "Full lint check for review (non-blocking):"
        ruff check src/ --exclude="src/hydra/templates/templates" --exit-zero
    
    - name: Run core tests
      env:
        LLM_PROVIDER: mock
        REDIS_URL: redis://localhost:6379/0
        DATABASE_URL: sqlite:///test.db
        TESTING: "1"
        PYTEST_XDIST_WORKER_COUNT: "2"  # Limit concurrent workers
      run: |
        # Run tests with reduced concurrency for CI stability
        timeout 18m python -m pytest tests/ -v --tb=short --timeout=300 \
          --maxfail=10 \
          -m "not stress" \
          --disable-warnings
    
    - name: Run CI integration tests
      env:
        LLM_PROVIDER: mock
        REDIS_URL: redis://localhost:6379/0
        DATABASE_URL: sqlite:///test.db
        TESTING: "1"
      run: |
        timeout 5m python -m pytest tests/test_ticket_creation.py tests/test_parallel_execution.py tests/test_verify_parallel.py tests/test_ci_integration.py -v --tb=short --timeout=60