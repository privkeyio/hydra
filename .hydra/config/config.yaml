version: "1.0.0"

llm:
  provider: "venice"
  model: null
  temperature: 0.2
  max_tokens: 2048
  timeout: 120

agent:
  max_depth: 2
  retry_attempts: 2
  timeout: 30

logging:
  level: "INFO"
  file: "logs/hydra.log"
  max_bytes: 10485760
  backup_count: 5

security:
  encrypt_sensitive: true
  allowed_paths:
    - "."
  blocked_operations:
    - "rm -rf"
    - "format"
    - "fdisk"