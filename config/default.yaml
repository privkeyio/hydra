# Hydra Configuration File

# LLM Provider Configuration
llm:
  # Provider type: venice, anthropic, openai, claude_cli
  provider: venice
  
  # Model name (optional - uses provider default if not specified)
  # model: qwen-2.5-coder-32b
  
  # Generation parameters
  temperature: 0.2
  max_tokens: 2048
  timeout: 30

# Agent Configuration
agent:
  max_depth: 2
  timeout: 30
  retry_attempts: 2
  default_name: "boss"

# Logging Configuration
logging:
  level: "INFO"
  file: "logs/agent_activity.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Execution Configuration
execution:
  sandbox: true
  allowed_modules:
    - "ast"
    - "json"
    - "math"
    - "datetime"
    - "collections"
    - "itertools"
    - "functools"