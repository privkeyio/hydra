patterns:
  - name: git_commit_confirmation
    pattern: 'git.*commit.*\?|Commit changes\?|Create commit'
    match_type: regex
    response_strategy: deny
    safety_override: true
    tags: [git, commit, dangerous, version_control]
    metadata:
      tool: git
      category: version_control
      danger_level: high
      requires_explicit_approval: true

  - name: git_push_confirmation
    pattern: 'git.*push.*\?|Push changes\?|Push to remote'
    match_type: regex
    response_strategy: deny
    safety_override: true
    tags: [git, push, dangerous, version_control]
    metadata:
      tool: git
      category: version_control
      danger_level: very_high
      requires_explicit_approval: true

  - name: git_merge_confirmation
    pattern: 'git.*merge.*\?|Merge.*branch\?|Complete merge'
    match_type: regex
    response_strategy: deny
    safety_override: true
    tags: [git, merge, dangerous, version_control]
    metadata:
      tool: git
      category: version_control
      danger_level: high

  - name: git_reset_warning
    pattern: 'git.*reset.*\?|Reset.*changes\?|Discard changes'
    match_type: regex
    response_strategy: deny
    safety_override: true
    tags: [git, reset, destructive, dangerous]
    metadata:
      tool: git
      category: destructive_ops
      danger_level: very_high

  - name: git_rebase_confirmation
    pattern: 'git.*rebase.*\?|Rebase.*branch\?|Interactive rebase'
    match_type: regex
    response_strategy: deny
    safety_override: true
    tags: [git, rebase, dangerous, history_rewrite]
    metadata:
      tool: git
      category: history_modification
      danger_level: high

  - name: git_force_push_warning
    pattern: 'force.*push|git.*push.*--force|git.*push.*-f'
    match_type: regex
    response_strategy: deny
    safety_override: true
    tags: [git, force_push, destructive, dangerous]
    metadata:
      tool: git
      category: destructive_ops
      danger_level: critical